<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="/love.png" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakinat - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Header and Burger Menu Styles */
        header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color:  #d81b60;
            padding: 12px 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            margin: 0;
            font-size: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Burger icon styles */
        .burger {
            width: 30px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 1001;
        }

        .burger div {
            height: 3px;
            width: 100%;
            background-color: white;
            transition: all 0.3s ease;
            border-radius: 3px;
        }

        /* Burger animation when active */
        .burger.active .line1 {
            transform: translateY(8px) rotate(45deg);
        }

        .burger.active .line2 {
            opacity: 0;
        }

        .burger.active .line3 {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* Navigation menu */
        #nav-menu {
            display: none;
            flex-direction: column;
            background-color: #d81b60;
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            padding: 15px 20px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            z-index: 999;
        }

        #nav-menu.active {
            display: flex;
        }

        /* Menu items */
        .menu-item {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            transition: background-color 0.3s;
            margin-bottom: 8px;
        }

        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .menu-item i {
            font-size: 20px;
        }

        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.25);
            font-weight: 600;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            position: fixed;
            height: 100vh;
            padding: 25px;
            display: flex;
            flex-direction: column;
            background-color: #d81b60;
            color: white;
            z-index: 900;
        }

        .sidebar h2 {
            font-size: 24px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Chat Container Styles */
        .chat-container {
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
        }

        .chat-header {
            padding: 18px 25px;
            background-color: #e65988;
            color: white;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-header i {
            font-size: 22px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .from-user {
            align-self: flex-end;
            background-color: #e65988;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .from-psychologist {
            align-self: flex-start;
            background-color: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 5px;
        }

        .message img {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 5px;
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .delete-btn {
            opacity: 1;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background-color: #fff;
            border-top: 1px solid #eee;
            align-items: center;
            gap: 10px;
        }

        .chat-input input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .chat-input input[type="text"]:focus {
            border-color: #e65988;
        }

        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f0f0f0;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .file-label:hover {
            background-color: #e0e0e0;
        }

        .chat-input button {
            padding: 12px 20px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .chat-input button:hover {
            background-color: #d14b7a;
        }

        /* Timestamp for messages */
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .sidebar {
                width: 250px;
            }
            .chat-container {
                margin-left: 250px;
            }
        }

        @media (max-width: 768px) {
            header {
                display: flex;
            }

            .sidebar {
                display: none;
            }

            .chat-container {
                margin-left: 0;
                padding-top: 60px;
                height: calc(100vh - 60px);
            }
        }

        @media (max-width: 576px) {
            .chat-header {
                padding: 15px;
                font-size: 16px;
            }

            .chat-box {
                padding: 15px;
            }

            .message {
                max-width: 85%;
                padding: 10px 14px;
                font-size: 14px;
            }

            .chat-input {
                padding: 12px;
            }

            .chat-input input[type="text"] {
                padding: 10px 15px;
                font-size: 14px;
            }

            .chat-input button {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- Header for Mobile -->
    <header>
        <div class="flex" style="display: flex; align-items: center;  gap: 10px;">
            <h2>Sakinat</h2>
            <img src="/love.png" alt="" width="40px" height="40px">
        </div>
        <div class="burger-menu">
            <div class="burger" onclick="toggleMenu()">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
            <nav id="nav-menu">
                <a href="#" class="menu-item active"><i class='bx bx-chat'></i>Chat</a>
                <a href="./psycholog.html" class="menu-item"><i class='bx bx-book'></i>Psychologists</a>
                <a href="./test1.html" class="menu-item"><i class='bx bx-video'></i>Tests</a>
                <a href="./game.html" class="menu-item"><i class='bx bx-joystick'></i>Games</a>
                <a href="/user-accaunt/index.html" class="menu-item"><i class='bx bx-user'></i>Profile</a>
            </nav>
        </div>
    </header>

    <!-- Sidebar for Desktop -->
    <div class="sidebar">
        <div class="flex" style="display: flex; align-items: center;  gap: 10px;">
            <h2>Sakinat</h2>
            <img src="/love.png" alt="" width="40px" height="40px">
        </div>
        <nav>
            <a href="#" class="menu-item active"><i class='bx bx-chat'></i>Chat</a>
            <a href="./psycholog.html" class="menu-item"><i class='bx bx-book'></i>Psychologists</a>
            <a href="./test1.html" class="menu-item"><i class='bx bx-video'></i>Tests</a>
            <a href="./game.html" class="menu-item"><i class='bx bx-joystick'></i>Games</a>
            <a href="/user-accaunt/index.html" class="menu-item"><i class='bx bx-user'></i>Profile</a>
        </nav>
    </div>

    <!-- Chat Interface --> 
    <div class="chat-container">
        <div class="chat-header">
            <i class='bx bx-conversation'></i> Chat with Psychologist
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message from-psychologist">
                Hello! I'm here to help you. Feel free to share what's on your mind.
                <div class="message-time">Today, 10:00 AM</div>
            </div>
        </div>
        <div class="chat-input">
            <label for="fileInput" class="file-label" title="Attach file">
                <i class='bx bx-paperclip'></i>
            </label>
            <input type="text" id="userMessage" placeholder="Type your message here...">
            <button id="sendBtn">
                <i class='bx bx-send'></i>
            </button>
            <input type="file" id="fileInput" style="display: none;" accept="image/*, .pdf, .doc, .docx">
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const userMessageInput = document.getElementById('userMessage');
        const chatBox = document.getElementById('chatBox');
        const fileInput = document.getElementById('fileInput');

        // Function to get current time
        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0'+minutes : minutes;
            
            return `${hours}:${minutes} ${ampm}`;
        }

        // Add message to chat
        function addMessage(text, sender = 'from-user', isImage = false) {
            const newMessage = document.createElement('div');
            newMessage.classList.add('message', sender);

            if (isImage) {
                const img = document.createElement('img');
                img.src = text;
                img.alt = 'Sent image';
                newMessage.appendChild(img);
            } else {
                newMessage.textContent = text;
            }

            // Add timestamp
            const timeElement = document.createElement('div');
            timeElement.classList.add('message-time');
            timeElement.textContent = getCurrentTime();
            newMessage.appendChild(timeElement);

            // Add delete button
            const deleteButton = document.createElement('button');
            deleteButton.innerHTML = '&times;';
            deleteButton.classList.add('delete-btn');
            deleteButton.title = 'Delete message';
            deleteButton.onclick = () => newMessage.remove();
            newMessage.appendChild(deleteButton);

            chatBox.appendChild(newMessage);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send message
        sendBtn.addEventListener('click', () => {
            const userMessage = userMessageInput.value.trim();
            if (userMessage) {
                addMessage(userMessage);
                userMessageInput.value = '';

                // Simulate psychologist reply after 1-3 seconds
                const replies = [
                    "I understand how you feel. Can you tell me more about that?",
                    "That sounds challenging. How long have you been feeling this way?",
                    "Thank you for sharing. Let's explore this together.",
                    "I hear you. What do you think would help in this situation?",
                    "That's an important observation. What emotions come up for you when you think about this?"
                ];
                
                const delay = 1000 + Math.random() * 2000; // 1-3 seconds
                setTimeout(() => {
                    const randomReply = replies[Math.floor(Math.random() * replies.length)];
                    addMessage(randomReply, 'from-psychologist');
                }, delay);
            }
        });

        // Handle file upload
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                // Check file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('File size should be less than 5MB');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    if (file.type.startsWith('image/')) {
                        addMessage(event.target.result, 'from-user', true);
                    } else {
                        addMessage(`File: ${file.name} (${(file.size/1024/1024).toFixed(2)}MB)`, 'from-user');
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // Send message on Enter key
        userMessageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        // Burger Menu Functionality
        function toggleMenu() {
            const navMenu = document.getElementById('nav-menu');
            const burger = document.querySelector('.burger');
            
            navMenu.classList.toggle('active');
            burger.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const navMenu = document.getElementById('nav-menu');
            const burger = document.querySelector('.burger');
            
            if (navMenu.classList.contains('active') && 
                !event.target.closest('.burger') && 
                !event.target.closest('#nav-menu')) {
                navMenu.classList.remove('active');
                burger.classList.remove('active');
            }
        });

        // Initialize mobile menu visibility based on screen size
        function checkScreenSize() {
            const header = document.querySelector('header');
            const sidebar = document.querySelector('.sidebar');
            
            if (window.innerWidth <= 768) {
                header.style.display = 'flex';
                sidebar.style.display = 'none';
            } else {
                header.style.display = 'none';
                sidebar.style.display = 'flex';
                document.getElementById('nav-menu').classList.remove('active');
                document.querySelector('.burger').classList.remove('active');
            }
        }

        // Highlight current page in menu
        function setActiveMenu() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const menuItems = document.querySelectorAll('.menu-item');
            
            menuItems.forEach(item => {
                item.classList.remove('active');
                const href = item.getAttribute('href');
                if (href && currentPage.includes(href.replace('./', ''))) {
                    item.classList.add('active');
                }
            });
        }

        // Event listeners
        window.addEventListener('DOMContentLoaded', function() {
            checkScreenSize();
            setActiveMenu();
        });
        
        window.addEventListener('resize', checkScreenSize);
    </script>
</body>
</html>
